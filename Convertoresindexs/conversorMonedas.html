<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conversor de Monedas</title>
    <link rel="stylesheet" href="../CSS/convertorMonedas.css">
</head>
<body>

    <div class="container">
        <h2>Conversor de Monedas</h2>
        
        <div class="converter">
            <input type="number" id="amount" placeholder="Cantidad" value="1" min="1">

            <select id="fromCurrency">
                <option value="ARS">Peso Argentino (ARS)</option>
                <option value="BRL">Real Brasileño (BRL)</option>
                <option value="CLP">Peso Chileno (CLP)</option>
                <option value="USD">Dólar (USD)</option>
                <option value="EUR">Euro (EUR)</option>
                <option value="MXN">Peso Mexicano (MXN)</option>
            </select>

            <span>➡</span>

            <select id="toCurrency">
                <option value="ARS">Peso Argentino (ARS)</option>
                <option value="BRL">Real Brasileño (BRL)</option>
                <option value="CLP">Peso Chileno (CLP)</option>
                <option value="USD">Dólar (USD)</option>
                <option value="EUR">Euro (EUR)</option>
                <option value="MXN">Peso Mexicano (MXN)</option>
            </select>

            <button id="convertBtn">Convertir</button>
        </div>

        <h3 id="result">Resultado: -</h3>
    </div>

    <script src="../estilesjavascript/conversorMonedas.js"></script>
</body>
</html>
