<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Convetor Criptomonedas</title>
    <link rel="stylesheet" href="../CSS/conversorCriptomonedas.css">
</head>
<body>
    <!-- Conversor de Criptomonedas -->
    <section>
        <h2>Conversor de Criptomonedas</h2>
        <label for="cryptoFrom">De:</label>
        <select id="cryptoFrom">
            <option value="bitcoin">Bitcoin (BTC)</option>
            <option value="ethereum">Ethereum (ETH)</option>
            <option value="tether">Tether (USDT)</option>
            <option value="binancecoin">Binance Coin (BNB)</option>
            <option value="ripple">Ripple (XRP)</option>
            <option value="cardano">Cardano (ADA)</option>
            <option value="solana">Solana (SOL)</option>
            <option value="polkadot">Polkadot (DOT)</option>
            <option value="litecoin">Litecoin (LTC)</option>
            <option value="dogecoin">Dogecoin (DOGE)</option>
        </select>

        <label for="cryptoTo">A:</label>
        <select id="cryptoTo">
            <option value="bitcoin">Bitcoin (BTC)</option>
            <option value="ethereum">Ethereum (ETH)</option>
            <option value="tether">Tether (USDT)</option>
            <option value="binancecoin">Binance Coin (BNB)</option>
            <option value="ripple">Ripple (XRP)</option>
            <option value="cardano">Cardano (ADA)</option>
            <option value="solana">Solana (SOL)</option>
            <option value="polkadot">Polkadot (DOT)</option>
            <option value="litecoin">Litecoin (LTC)</option>
            <option value="dogecoin">Dogecoin (DOGE)</option>
        </select>

        <label for="cryptoAmount">Cantidad:</label>
        <input type="number" id="cryptoAmount" placeholder="Ingrese la cantidad" />

        <button id="convertCrypto">Convertir</button>
        <div id="cryptoResult"></div>
    </section>

    <script src="../estilesjavascript/conversorCriptomnedas.js"></script>
</body>
</html>
